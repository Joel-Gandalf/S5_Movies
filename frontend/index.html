<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <script type="text/javascript">
            // Single Page Apps for GitHub Pages
            // MIT License
            // https://github.com/rafgraph/spa-github-pages
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search
                        .slice(1)
                        .split('&')
                        .map(function (s) {
                            return s.replace(/~and~/g, '&');
                        })
                        .join('?');
                    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
                }
            })(window.location);
        </script>
        <link rel="icon" type="image/png" href="/favicon-32x32.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta 
            name="description" 
            content="Movies Factor — Explora películas con datos en tiempo real de TMDB, guarda tus favoritas y puntúalas. Plataforma web interactiva de descubrimiento y gestión de películas." 
        />
        <title>Movies Factor</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
